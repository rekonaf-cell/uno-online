<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ページワン Online</title>
<link rel="icon" type="image/png" href="/icons/favicon.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#c8102e" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <button id="leaveBtn" class="leave-btn hidden">← 部屋に戻る</button>
    <!-- ロビー画面 -->
    <section id="lobby" class="screen">
      <h1>ページワン Online</h1>
      <input id="nameInput" type="text" placeholder="ニックネーム" maxlength="12" />
      <button id="createBtn">部屋を作る</button>
      <div class="divider">または</div>
      <input id="codeInput" type="text" inputmode="numeric" placeholder="部屋コード(4桁)" maxlength="4" />
      <button id="joinBtn">参加する</button>
      <p id="lobbyError" class="error"></p>
    </section>

    <!-- 待機室画面 -->
    <section id="waiting" class="screen hidden">
      <h2>部屋コード: <span id="roomCodeDisplay"></span></h2>

      <div id="lobbyWaitContent">
        <p class="hint">このコードを友達に伝えて参加してもらいましょう</p>
        <ul id="playerList"></ul>
        <button id="addBotBtn" class="hidden secondary-btn">CPUを追加</button>
        <button id="startBtn" class="hidden">ゲーム開始</button>
        <p id="waitingHint" class="hint">ホストの開始を待っています…</p>
      </div>

      <div id="diceWaitContent" class="hidden">
        <h3>親を決めるサイコロ🎲</h3>
        <ul id="diceResultList"></ul>
        <button id="rollDiceBtn" class="hidden">サイコロを振る</button>
        <p id="diceHint" class="hint"></p>
      </div>

      <div id="handSizeWaitContent" class="hidden">
        <h3>配る枚数を決めます</h3>
        <p id="dealerNameText" class="hint"></p>
        <div id="handSizeChooser" class="hidden">
          <div id="handSizePresets" class="hand-size-presets">
            <button type="button" class="hand-size-btn" data-size="3">3枚</button>
            <button type="button" class="hand-size-btn" data-size="4">4枚</button>
            <button type="button" class="hand-size-btn" data-size="5">5枚</button>
            <button type="button" id="handSizeOtherBtn" class="hand-size-btn">その他</button>
          </div>
          <div id="handSizeCustom" class="hidden">
            <input id="handSizeInput" type="number" min="3" value="7" />
            <button id="submitHandSizeBtn">この枚数で配る</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ゲーム画面 -->
    <section id="game" class="screen hidden">
      <div id="roundTable">
        <div id="dirBadge">↻</div>
        <div class="deck-pile" id="drawPile"><span id="deckCount"></span></div>
        <div id="tableSeats"></div>
        <div id="tableCenter">
          <div id="historyStack"></div>
        </div>
        <div id="selfSeat">
          <div class="seat-avatar self" id="selfAvatarWrap">😊<div class="count-badge" id="selfCountBadge">0</div></div>
        </div>
      </div>
      <div id="turnInfo"></div>

      <div id="myArea">
        <div id="myName"></div>
        <div id="hand"></div>
        <div id="actions">
          <button id="drawBtn" class="hidden">カードを引く</button>
          <button id="pageOneBtn" class="hidden pageone-btn">ページワン！</button>
          <button id="ronBtn" class="hidden ron-btn">当たり！</button>
          <button id="dosunBtn" class="hidden dosun-btn">ドン！</button>
          <button id="ronBackBtn" class="hidden ronback-btn">当たり返し！</button>
          <button id="declineRonBackBtn" class="hidden pass-btn">見送る</button>
          <button id="passBtn" class="hidden pass-btn">通す</button>
        </div>
      </div>

      <div id="logBox"></div>
    </section>

    <!-- マーク選択モーダル -->
    <div id="suitModal" class="modal hidden">
      <div class="modal-content">
        <p>マークを選んでください</p>
        <div class="suit-choices">
          <button data-suit="spade" class="suit-btn black">♠</button>
          <button data-suit="heart" class="suit-btn red">♥</button>
          <button data-suit="diamond" class="suit-btn red">♦</button>
          <button data-suit="club" class="suit-btn black">♣</button>
        </div>
        <div id="rankChooser" class="hidden">
          <p>数字を選んでください(ジョーカーが扱う数字)</p>
          <p id="jokerMatchHint" class="hint hidden">※マークか数字のどちらかは場に合わせてください</p>
          <div id="rankChoices" class="rank-choices"></div>
        </div>
      </div>
    </div>

    <!-- 勝利モーダル -->
    <div id="winModal" class="modal hidden">
      <div class="modal-content">
        <p id="winText"></p>
        <div id="revealedHands"></div>
        <div id="scoreAnims"></div>
        <ul id="roundResultList"></ul>
        <button id="historyBtn" class="secondary-btn">途中結果</button>
        <div id="historyView" class="hidden"></div>
        <button id="nextRoundBtn" class="hidden">次のラウンドへ</button>
        <button id="leaveBtnWin" class="secondary-btn">部屋に戻る</button>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
